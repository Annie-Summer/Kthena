# Real AASP cutover for ModelServing (replace MOCK env block with this).
# Prerequisites:
#   1) Rebuild/push adapter image that includes INSTANCE_ID + X-Auth-Token + optional IAM refresh
#   2) Cluster pods can reach BASE_URL and (if auto-refresh) IAM_AUTH_URL
#   3) Secret holds TOKEN and/or IAM password
#
# Token modes:
#   A) Manual: stringData.token only → update Secret + recreate pods when expired
#   B) Auto: also set IAM_* env from Secret → Adapter re-logins on 401 (in-memory, no restart)
#
# Example mapping from curl:
#   curl -H "X-Auth-Token: ..." \
#     "http://52.170.215.202:8088/v1/<PROJECT_ID>/instance/<INSTANCE_ID>/infer-recommendations?..."
---
apiVersion: v1
kind: Secret
metadata:
  name: aasp-api-token
  namespace: aasp-scale-demo
type: Opaque
stringData:
  token: "PUT_REAL_X_AUTH_TOKEN_HERE"
  # Optional for Adapter IAM auto-refresh:
  # iam-password: "PUT_IAM_USER_PASSWORD_HERE"
---
# Patch-style reference for ModelServing container env (keep LEADER_ELECTION / POD_*):
# MOCK=0
# BASE_URL=http://52.170.215.202:8088
# PROJECT_ID=5dfed145e29a43f7b42c5ecc17d4d98c
# INSTANCE_ID=922ae983-addb-46e8-8096-5092de62af13
# REGION=cn-north-5
# AUTH_HEADER=x-auth-token
# TIME_RANGE_MODE=forward
# WINDOW_MINUTES=10
# TOKEN from secret key token
#
# Optional auto-refresh (enable together):
# IAM_AUTH_URL=https://iam.myhuaweicloud.com/v3/auth/tokens?nocatalog=true
# IAM_DOMAIN=<account domain>
# IAM_USER=<iam user>
# IAM_PASSWORD from secret key iam-password
# IAM_PROJECT_NAME=cn-north-5
#   (or IAM_PROJECT_ID=<project uuid>)
#
# LEADER_ELECTION=1
# LEASE_NAME=aasp-metrics-leader
# POD_NAME / POD_NAMESPACE downward API
